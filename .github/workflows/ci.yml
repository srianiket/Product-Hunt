name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Run anytime from the Actions tab → "Run workflow"
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - ui

jobs:
  api:
    name: API (Bun)
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: API tests
        env:
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: bun run test:api

  ui:
    name: UI (Playwright)
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.suite == 'all' ||
      github.event.inputs.suite == 'ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: UI tests
        env:
          CI: true
          BASE_URL: https://www.producthunt.com
        run: bun run test:ui
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
